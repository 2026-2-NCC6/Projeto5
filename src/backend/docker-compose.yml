version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart_tennis_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_tennis_arena
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: smart_tennis_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: smart_tennis_arena_jwt_secret_fecap_2026_ccomp
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: smart_tennis_arena
    depends_on:
      - mysql

volumes:
  mysql_data:
